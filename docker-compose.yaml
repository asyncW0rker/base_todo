services:
  pg:
    image: postgres:18
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
      - PGPORT=${DB_PORT}
    volumes:
      - todo_data:/var/lib/postgresql/18/docker
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio
    ports:
      - "${S3_API_PORT}:${S3_API_PORT}"
      - "${S3_GUI_PORT}:${S3_GUI_PORT}"
    environment:
      - MINIO_ROOT_USER=${S3_USER}
      - MINIO_ROOT_PASSWORD=${S3_PASS}
    command: server /data --console-address ":${S3_GUI_PORT}"
    volumes:
      - minio_data:/data
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  worker:
    build: .
    env_file:
      - .env.worker
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uv run taskiq worker app.utils.background.broker:broker


volumes:
  todo_data:
  minio_data:
  redis_data:
