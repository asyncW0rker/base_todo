services:
  pg:
    image: postgres:18
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
      - PGPORT=${DB_PORT}
    volumes:
      - todo_data:/var/lib/postgresql/18/docker
    restart: unless-stopped

volumes:
  todo_data:
