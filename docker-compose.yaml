services:
  pg:
    image: postgres:18
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
      - PGPORT=${DB_PORT}
    volumes:
      - todo_data:/var/lib/postgresql/18/docker
    restart: unless-stopped
  minio:
    image: minio/minio
    ports:
      - "${S3_API_PORT}:${S3_API_PORT}"
      - "${S3_GUI_PORT}:${S3_GUI_PORT}"
    environment:
      - MINIO_ROOT_USER=${S3_USER}
      - MINIO_ROOT_PASSWORD=${S3_PASS}
    command: server /data --console-address ":${S3_GUI_PORT}"
    volumes:
      - minio_data:/data
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  todo_data:
  minio_data:
  redis_data:
